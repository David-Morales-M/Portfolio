<section id="presentation">
  <label class="title-section">Presentation</label>
  <app-card class="card-container"></app-card>
</section>

<section id="aboutme">
  <label class="title-section">About me section</label>
  <div class="about-container">
    <label>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore
      magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo
      consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.
      Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.
    </label>
  </div>
</section>

<section id="projects">
  <label class="title-section">Proyectos</label>
  @for (project of projects; track project.id) {
    <app-projects [project]="project" class="card-container"></app-projects>
  }
</section>

<section id="skills">
  <label class="title-section">Skills</label>
</section>

<section id="certificates">
  <label class="title-section">Certificates</label>
  <div class="middle">
    <div></div>
      @for (certificate of certificates; track certificate.id) {
        <app-certificates [certificate]="certificate" class="certificates-container"></app-certificates>
      }
    <div></div>
  </div>
</section>

<section id="publications">
  <label class="title-section">Publications</label>
  <div class="middle">
    @for (publication of publications; track publication.id) {
      <app-publications [publication]="publication" class="card-container"></app-publications>
    }
  </div>
</section>

<section>
  <label class="title-section">Contact</label>
</section>
